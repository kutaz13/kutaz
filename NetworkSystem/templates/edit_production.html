<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل التشغيلة</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        .main-wrapper { padding: 40px; display: flex; justify-content: center; background: #0b0e14; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 30px; width: 100%; max-width: 500px; box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37); }
        h2 { color: #00c6ff; text-align: center; margin-bottom: 25px; text-shadow: 0 0 10px rgba(0, 198, 255, 0.5); }
        label { color: #ccc; display: block; margin-bottom: 8px; font-size: 0.9rem; margin-right: 5px; }
        .glass-input { width: 100%; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 10px; padding: 12px; color: #fff; margin-bottom: 20px; transition: 0.3s; box-sizing: border-box; }
        .glass-input:focus { outline: none; border-color: #00c6ff; background: rgba(255, 255, 255, 0.12); box-shadow: 0 0 10px rgba(0, 198, 255, 0.3); }
        .btn-primary { width: 100%; padding: 15px; background: linear-gradient(45deg, #00c6ff, #0072ff); border: none; border-radius: 10px; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 1rem; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0, 114, 255, 0.4); }
        .cancel-link { display: block; text-align: center; color: #aaa; margin-top: 15px; text-decoration: none; font-size: 0.9rem; }
        .cancel-link:hover { color: #fff; }
    </style>
</head>
<body>
<div class="main-wrapper">
    <div class="glass-card">
        <h2>✏️ تعديل اللوط {{ log.lot_no }}</h2>
        <form method="POST">
            <label>رقم الأوردر (Order No):</label>
            <input type="text" name="order_no" value="{{ log.order_no }}" class="glass-input" required>

            <label>رقم اللوط (Lot No):</label>
            <input type="text" name="lot_no" value="{{ log.lot_no }}" class="glass-input" required>
            
            <label>نوع الخامة:</label>
            <input type="text" name="roll_type" value="{{ log.roll_type }}" class="glass-input" required>
            
            <div style="display: flex; gap: 15px;">
                <div style="flex: 1;">
                    <label>عدد البكر:</label>
                    <input type="number" name="joints" value="{{ log.joints }}" class="glass-input" required>
                </div>
                <div style="flex: 1;">
                    <label>وزن البكرة:</label>
                    <input type="number" step="0.01" name="weight" value="{{ log.weight }}" class="glass-input" required>
                </div>
            </div>

            <button type="submit" class="btn-primary">تحديث البيانات الآن</button>
            <a href="/production_system" class="cancel-link">إلغاء والعودة</a>
        </form>
    </div>
</div>
</body>
</html>
