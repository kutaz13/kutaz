<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تسجيل الدخول - بوابة مراقبة الشبكة</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <style>
        body { 
            /* خلفية بديلة: كوكب الأرض مع شبكة اتصالات فخمة */
            background-image: url('https://images.unsplash.com/photo-1518770660439-4636190af475?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Cairo', 'Segoe UI', sans-serif; /* خط عربي فخم */
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px; /* تعطي عمق للـ 3D */
            overflow: hidden; /* تمنع التمرير */
        }

        /* تصميم كارت تسجيل الدخول الزجاجي الـ 3D الفخم */
        .login-card-3d { 
            border-radius: 20px; 
            background: rgba(0, 0, 0, 0.4); /* خلفية داكنة شفافة */
            backdrop-filter: blur(15px); /* تغبيش الخلفية */
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 40px 100px rgba(0,0,0,1);
            padding: 60px;
            transform-style: preserve-3d;
            max-width: 500px;
            width: 90%;
            text-align: center;
            color: white !important;
        }

        .title-3d {
            text-shadow: 2px 2px 10px rgba(0,212,255,0.7); /* ظل أزرق تقني */
            transform: translateZ(80px); /* يخلي العنوان يبرز لقدام جداً */
            font-weight: bold;
            margin-bottom: 30px;
            color: #ffffff;
        }

        .form-control {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: white !important;
            transform: translateZ(40px); /* يخلي المدخلات تبرز شوية */
            border-radius: 8px;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.6) !important;
        }

        .btn-3d {
            background-color: #00d4ff; /* لون أزرق سماوي تقني وفخم */
            color: #000;
            font-weight: bold;
            border: none;
            padding: 14px;
            border-radius: 8px;
            width: 100%;
            transition: all 0.3s ease;
            transform: translateZ(60px); /* يخلي الزر يبرز لقدام */
        }

        .btn-3d:hover {
            background-color: #ffffff;
            color: #000;
            box-shadow: 0 0 25px #00d4ff;
        }

        .network-icon {
            transform: translateZ(50px); /* يخلي الأيقونة تبرز لقدام */
            color: #00d4ff;
            font-size: 3.5rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="login-card-3d" data-tilt data-tilt-max="10" data-tilt-speed="500" data-tilt-glare data-tilt-max-glare="0.5">
        
        <div class="network-icon">🌐</div> <h1 class="title-3d fw-bold mb-4">بوابة كوجيبي
            
        </h1>
        <p class="text-light mb-5">تأكيد هويتك للوصول لنظام إدارة الشبكات</p>
        
        <form method="POST">
            <input type="text" name="username" class="form-control mb-3" placeholder="اسم المستخدم" required>
            <input type="password" name="password" class="form-control mb-3" placeholder="كلمة المرور" required>
            <button type="submit" class="btn-3d btn-lg">تسجيل الدخول</button>
        </form>
        <a href="/register" style="color: #00d4ff; display: block; margin-top: 15px; text-decoration: none;">ليس لديك حساب؟ سجل الآن</a>
        <div class="mt-3" style="text-align: center; margin-top: 15px;">
</div>

    </div>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
</body>
</html>
