<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب - نظام المراقبة</title>
    <style>
        body { 
            margin: 0; display: flex; justify-content: center; align-items: center; 
            min-height: 100vh; font-family: 'Segoe UI', sans-serif; overflow: hidden;
            background: #050a10;
        }

        /* الخلفية المتحركة (مطابقة للرئيسية) */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072') center/cover;
            animation: rotateEarth 60s linear infinite; z-index: -1;
        }
        @keyframes rotateEarth { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }

        /* الكارت الزجاجي */
        .register-card { 
            background: rgba(0, 0, 0, 0.5) !important; 
            backdrop-filter: blur(20px); 
            padding: 40px; 
            border-radius: 25px; 
            width: 350px; 
            text-align: center; 
            border: 1px solid rgba(0, 212, 255, 0.3);
            color: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #00d4ff; border: none; border-radius: 10px; color: black; font-weight: bold; cursor: pointer; margin-top: 15px; transition: 0.3s; }
        button:hover { background: #fff; }
        a { color: #00d4ff; text-decoration: none; font-size: 0.9em; display: block; margin-top: 20px; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <div class="register-card" data-tilt data-tilt-max="10">
        <h2 style="color: #00d4ff;">إنشاء حساب جديد</h2>
        <p style="opacity: 0.7; margin-bottom: 20px;">انضم لشبكة المراقبة الدولية</p>
        
        <form action="/register" method="POST">
            <input type="text" name="username" placeholder="اسم المستخدم" required>
            <input type="password" name="password" placeholder="كلمة المرور" required>
            <button type="submit">تسجيل الآن</button>
        </form>
        
        <a href="/login">لديك حساب؟ سجل دخولك</a>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/vanilla-tilt/1.7.0/vanilla-tilt.min.js"></script>
    
    <script>
    function toggleChat() {
        const chatBox = document.getElementById('chat-box');
        chatBox.style.display = chatBox.style.display === 'none' ? 'block' : 'none';
    }

    document.getElementById('chat-input').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            const msg = this.value;
            const chatLog = document.getElementById('chat-messages');
            chatLog.innerHTML += `<div style="text-align:right; margin-bottom:5px;">أنت: ${msg}</div>`;
            this.value = '';
            
            // محاكاة رد من النظام
            setTimeout(() => {
                chatLog.innerHTML += `<div style="color:#00ff88; margin-bottom:5px;">المركز: جاري المعالجة...</div>`;
                chatLog.scrollTop = chatLog.scrollHeight;
            }, 1000);
        }
    });
</script>
    <head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
</body>
</html>
